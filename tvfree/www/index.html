<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TV ฟรี</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
video { width: 100%; height: 100%; object-fit: contain; background: #000; display: none; }
iframe { width: 100%; height: 100%; border: none; display: none; }
</style>
</head>
<body>
<video id="v" controls playsinline autoplay></video>
<iframe id="f" allow="autoplay; fullscreen"></iframe>
<script src="hls.min.js"></script>
<script>
(function() {
    var v = document.getElementById('v');
    var f = document.getElementById('f');
    var streams = [
        'https://thaipbs-mcx0wm.cdn.byteark.com/live/playlist.m3u8',
        'https://thaipbs-mcx0wm.cdn.byteark.com/live/playlist_720p/index.m3u8',
        'https://thaipbs-mcx0wm.cdn.byteark.com/live/playlist_480p/index.m3u8'
    ];
    var streamIdx = 0;

    function tryStream(url) {
        if (Hls.isSupported()) {
            var h = new Hls({ enableWorker: false, maxBufferLength: 10, maxMaxBufferLength: 20 });
            h.loadSource(url);
            h.attachMedia(v);
            h.on(Hls.Events.MANIFEST_PARSED, function() {
                v.style.display = 'block';
                f.style.display = 'none';
                v.play().catch(function() {});
            });
            h.on(Hls.Events.ERROR, function(e, d) {
                if (d.fatal) {
                    h.destroy();
                    streamIdx++;
                    if (streamIdx < streams.length) {
                        setTimeout(function() { tryStream(streams[streamIdx]); }, 1000);
                    } else {
                        showIframe();
                    }
                }
            });
        } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
            v.src = url;
            v.style.display = 'block';
            f.style.display = 'none';
            v.play().catch(function() {});
        } else {
            showIframe();
        }
    }

    function showIframe() {
        v.style.display = 'none';
        f.style.display = 'block';
        f.src = 'https://www.thaipbs.or.th/live';
    }

    tryStream(streams[0]);
})();
</script>
</body>
</html>
