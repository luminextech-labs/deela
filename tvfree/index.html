<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>📺 ดูทีวีฟรี</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      opacity: 1;
      transition: opacity 0.5s;
    }
    #overlay.hide { opacity: 0; pointer-events: none; }
    #overlay .channel-name {
      font-size: 16px;
      font-weight: 600;
    }
    #overlay .live-badge {
      background: #e74c3c;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    #error {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    #error h3 { margin-bottom: 8px; color: #e74c3c; }
    #error p { color: #888; font-size: 14px; margin-bottom: 16px; }
    #error button {
      padding: 10px 24px;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    #error button:hover { background: #2980b9; }
  </style>
</head>
<body>

<div id="overlay">
  <span class="live-badge">LIVE</span>
  <span class="channel-name">Thai PBS</span>
</div>

<video id="player" controls playsinline autoplay>
  Your browser does not support video.
</video>

<div id="error">
  <h3>ไม่สามารถเล่นสัญญาณได้</h3>
  <p>กดปุ่มด้านล่างเพื่อลองใหม่</p>
  <button onclick="retry()">ลองใหม่</button>
</div>

<script>
  const streamUrl = 'https://thaipbs-mcx0wm.cdn.byteark.com/live/playlist.m3u8';

  const video = document.getElementById('player');
  const overlay = document.getElementById('overlay');
  const errorDiv = document.getElementById('error');

  function hideOverlayOnTap() {
    overlay.classList.add('hide');
  }
  document.addEventListener('click', hideOverlayOnTap);
  document.addEventListener('touchstart', hideOverlayOnTap);

  function retry() {
    errorDiv.style.display = 'none';
    video.style.display = 'block';
    playStream();
  }

  function playStream() {
    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, function(event, data) {
        if (data.fatal) {
          video.style.display = 'none';
          errorDiv.style.display = 'flex';
          hls.destroy();
        }
      });
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play().catch(() =>{});
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.play().catch(() =>{});
    } else {
      video.style.display = 'none';
      errorDiv.style.display = 'flex';
    }
  }

  // Auto-load on page open
  playStream();
</script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>

</body>
</html>
